<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>技能卡背誦與語音測驗系統 (旗艦版)</title>

  <!-- 載入 Tailwind CSS (排版與美化) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 載入 FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- 載入 React 核心函式庫 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 載入 Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- 載入 Firebase (v8) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <style>
    .preserve-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .recording-pulse { animation: pulse-ring 1.5s infinite; }
  </style>
</head>
<body class="bg-indigo-50 font-sans text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- 1. Firebase 初始化 ---
    const customFirebaseConfig = {
      apiKey: "AIzaSyCi1ltDPRUd1LE3_Rf42YaRF1K28tY9FRE",
      authDomain: "card-8ba7e.firebaseapp.com",
      projectId: "card-8ba7e",
      storageBucket: "card-8ba7e.firebasestorage.app",
      messagingSenderId: "111155281491",
      appId: "1:111155281491:web:1b6e6da300291e9e6450a6",
      measurementId: "G-CWMC69DRFC"
    };

    let app, auth, db;
    const appId = 'digital-skill-card-game';
    
    try {
      if (!firebase.apps.length) {
        app = firebase.initializeApp(customFirebaseConfig);
      } else {
        app = firebase.app();
      }
      auth = firebase.auth();
      db = firebase.firestore();
    } catch (e) {
      console.error("Firebase 初始化失敗:", e);
    }

    // --- 工具函式 ---
    const resizeImage = (file, maxWidth = 400) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const ratio = maxWidth / img.width;
            canvas.width = maxWidth;
            canvas.height = img.height * ratio;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.8));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    };

    const CATEGORIES = ['食', '衣', '住', '行', '育', '樂', '隱藏'];

    const getCategoryStyle = (category) => {
      const config = {
        '食': { bg: 'from-green-400 to-emerald-600', icon: 'fa-utensils' },
        '衣': { bg: 'from-pink-400 to-rose-600', icon: 'fa-shirt' },
        '住': { bg: 'from-teal-400 to-cyan-600', icon: 'fa-house' },
        '行': { bg: 'from-blue-400 to-indigo-600', icon: 'fa-car-side' },
        '育': { bg: 'from-orange-400 to-amber-600', icon: 'fa-book-open' },
        '樂': { bg: 'from-yellow-400 to-orange-500', icon: 'fa-gamepad' },
        '隱藏': { bg: 'from-purple-500 to-fuchsia-700', icon: 'fa-circle-question' },
        '預設': { bg: 'from-indigo-400 to-purple-500', icon: 'fa-gem' },
      };
      return config[category] || config['預設'];
    };

    const speakText = (text, onEndCallback) => {
      if (!('speechSynthesis' in window)) {
        if (onEndCallback) onEndCallback();
        return;
      }
      window.speechSynthesis.cancel();
      const cleanText = text.replace(/\\n|\n/g, '，');
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'zh-TW';
      utterance.rate = 0.85; 
      
      if (onEndCallback) {
        utterance.onend = onEndCallback;
        utterance.onerror = onEndCallback;
      }
      window.speechSynthesis.speak(utterance);
    };

    const normalizeText = (t) => {
      return (t || '').replace(/[\s\n,。，！!？\?]/g, '').trim();
    };

    // --- 卡片元件 ---
    const FlashCard = ({ card, isFlipped, onClick, categoryImages, mode }) => {
      const style = getCategoryStyle(card.category);
      const customImg = categoryImages[card.category];
      const lines = card.text.split(/\\n|\n/).filter(l => l !== '');

      return (
        <div 
          className="relative w-full cursor-pointer group" 
          style={{ perspective: '1000px', aspectRatio: '3/4' }}
          onClick={onClick}
        >
          <div 
            className="w-full h-full transition-transform duration-500 ease-in-out preserve-3d relative shadow-md rounded-xl"
            style={{ transform: isFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)' }}
          >
            {/* 背面 */}
            {customImg ? (
              <div className="absolute inset-0 w-full h-full rounded-xl border-4 border-slate-200 bg-white flex items-center justify-center p-2 backface-hidden group-hover:shadow-lg transition-all">
                <img src={customImg} alt={card.category} className="w-full h-full object-contain" />
              </div>
            ) : (
              <div className={`absolute inset-0 w-full h-full rounded-xl border-4 border-white bg-gradient-to-br ${style.bg} flex flex-col items-center justify-center backface-hidden group-hover:shadow-lg transition-all`}>
                <div className="border-2 border-white/30 border-dashed rounded-lg w-10/12 h-[92%] flex flex-col items-center justify-center relative">
                  <i className={`fa-solid ${style.icon} text-4xl sm:text-5xl text-white drop-shadow mb-3`}></i>
                  <span className="text-white font-bold tracking-widest text-lg sm:text-xl drop-shadow-md">{card.category}</span>
                </div>
              </div>
            )}

            {/* 正面 */}
            <div 
              className="absolute inset-0 w-full h-full rounded-xl border-4 border-amber-300 bg-amber-50 flex flex-col items-center justify-center p-4 backface-hidden overflow-hidden"
              style={{ transform: 'rotateY(180deg)' }}
            >
              <div className="absolute top-[-20px] left-[-20px] text-6xl opacity-10 text-amber-500 rotate-12"><i className={`fa-solid ${style.icon}`}></i></div>
              <div className="absolute bottom-[-20px] right-[-20px] text-6xl opacity-10 text-amber-500 -rotate-12"><i className={`fa-solid ${style.icon}`}></i></div>
              
              <div className="relative z-10 flex flex-col items-center gap-2 w-full">
                {lines.map((line, i) => (
                  <span key={i} className="text-xl sm:text-2xl font-bold text-center text-amber-900 leading-tight w-full break-words" style={{ fontFamily: 'BiauKai, sans-serif' }}>
                    {line}
                  </span>
                ))}
              </div>
              
              {mode === 'practice' && (
                <div className="absolute bottom-3 text-amber-600 text-xs flex items-center gap-1 opacity-70 animate-pulse">
                  <i className="fa-solid fa-volume-high"></i> 唸讀中...
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    // --- 主應用程式 ---
    const App = () => {
      // 網址參數判斷身份
      const urlParams = new URLSearchParams(window.location.search);
      const urlTestId = urlParams.get('testId');
      
      // 全域狀態
      const [user, setUser] = useState(null);
      // 'teacher_setup' | 'teacher_dashboard' | 'student_login' | 'student_menu' | 'practice' | 'testing' | 'result'
      const [appState, setAppState] = useState(urlTestId ? 'student_login' : 'teacher_setup');
      
      // ================= 教師端狀態 =================
      const [skillsText, setSkillsText] = useState(
        "(食)我會 自己洗碗\n(衣)我會 自己摺衣服\n(住)我知道 整理房間\n(行)我能 過馬路看紅綠燈\n(育)我會 準時完成作業\n(樂)我知道 玩完玩具收好\n(隱藏)我會 自己打理背包"
      );
      const [categoryImages, setCategoryImages] = useState({});
      const [showSettings, setShowSettings] = useState(true);
      const [testCriteria, setTestCriteria] = useState({});
      const [activeTestId, setActiveTestId] = useState(null);
      const [studentResults, setStudentResults] = useState([]); // 即時收取的學生成績

      // ================= 學生端狀態 =================
      const [studentName, setStudentName] = useState('');
      const [studentConfig, setStudentConfig] = useState(null); // 從雲端抓取的測驗設定
      
      // ================= 遊戲運行狀態 =================
      const [gameCards, setGameCards] = useState([]);
      const [flippedIds, setFlippedIds] = useState([]);
      const [testAnswers, setTestAnswers] = useState({}); 
      const [recordingId, setRecordingId] = useState(null); 
      const [finalScore, setFinalScore] = useState({ score: 0, correct: 0 });

      // --- 1. 初始化 Firebase 認證 ---
      useEffect(() => {
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await auth.signInWithCustomToken(__initial_auth_token);
            } else {
              await auth.signInAnonymously();
            }
          } catch (e) {
            console.error("Auth failed:", e);
          }
        };
        initAuth();
        const unsubscribe = auth.onAuthStateChanged(u => setUser(u));
        return () => unsubscribe();
      }, []);

      // --- 文字解析邏輯 ---
      const parsedDeck = React.useMemo(() => {
        return skillsText.split('\n')
          .map((line) => line.trim())
          .filter(line => line.length > 0)
          .map((line, index) => {
            let category = '預設';
            let content = line;
            const match = line.match(/^[\(（](.*?)[\)）]/);
            if (match) {
              category = match[1];
              content = line.replace(/^[\(（].*?[\)）]/, '').trim();
            }
            content = content.replace(/\s+/g, '\n');
            return { id: `card_${index}`, category, text: content };
          });
      }, [skillsText]);

      const availableCounts = React.useMemo(() => {
        const counts = {};
        CATEGORIES.forEach(cat => counts[cat] = 0);
        parsedDeck.forEach(card => {
          if (counts[card.category] !== undefined) counts[card.category]++;
        });
        return counts;
      }, [parsedDeck]);

      useEffect(() => {
        setTestCriteria(prev => {
          const newCriteria = { ...prev };
          CATEGORIES.forEach(cat => {
            if (newCriteria[cat] === undefined) newCriteria[cat] = 0;
            if (newCriteria[cat] > availableCounts[cat]) newCriteria[cat] = availableCounts[cat];
          });
          return newCriteria;
        });
      }, [availableCounts]);

      const totalTestCount = CATEGORIES.reduce((sum, cat) => sum + (testCriteria[cat] || 0), 0);

      const adjustCriteria = (cat, delta) => {
        setTestCriteria(prev => {
          let nextVal = (prev[cat] || 0) + delta;
          if (nextVal < 0) nextVal = 0;
          if (nextVal > availableCounts[cat]) nextVal = availableCounts[cat];
          return { ...prev, [cat]: nextVal };
        });
      };

      const handleCategoryUpload = async (category, e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const compressedUrl = await resizeImage(file, 400);
          setCategoryImages(prev => ({ ...prev, [category]: compressedUrl }));
        } catch (err) {
          alert('圖片處理失敗');
        }
      };

      // ================= 教師端功能 =================
      // 發布測驗 (儲存至 Firestore)
      const deployTest = async () => {
        if (!user) return alert('系統尚未連線，請稍後再試。');
        if (parsedDeck.length === 0) return alert('請至少輸入 1 張卡片！');
        if (totalTestCount === 0) return alert('請至少設定 1 題以上的測驗標準！');

        try {
          const configRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('testConfigs');
          const docRef = await configRef.add({
            deck: parsedDeck,
            categoryImages: categoryImages,
            testCriteria: testCriteria,
            totalTestCount: totalTestCount,
            createdAt: Date.now(),
            teacherId: user.uid
          });
          
          setActiveTestId(docRef.id);
          setAppState('teacher_dashboard');
        } catch (e) {
          console.error("Deploy failed:", e);
          alert('派發失敗，請檢查權限或網路。');
        }
      };

      // 監聽測驗結果
      useEffect(() => {
        if (appState === 'teacher_dashboard' && activeTestId && user) {
          const resultsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('testResults');
          const unsub = resultsRef.onSnapshot((snapshot) => {
            const res = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            // 在記憶體中篩選出屬於這個測驗的結果
            const currentTestRes = res.filter(r => r.testId === activeTestId);
            setStudentResults(currentTestRes);
          });
          return () => unsub();
        }
      }, [appState, activeTestId, user]);


      // ================= 學生端功能 =================
      // 學生登入並抓取測驗設定
      const studentLogin = async () => {
        if (!studentName.trim()) return alert('請輸入您的班級與姓名喔！');
        if (!user) return alert('系統連線中，請稍候...');

        try {
          const configDoc = await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('testConfigs').doc(urlTestId).get();
          if (configDoc.exists) {
            setStudentConfig(configDoc.data());
            setAppState('student_menu');
          } else {
            alert('找不到這份測驗，請確認 QR Code 是否正確。');
          }
        } catch (e) {
          console.error("Fetch config failed", e);
          alert('讀取測驗資料失敗。');
        }
      };

      // 學生選擇模式並洗牌發牌
      const setupGameCards = (mode) => {
        let selectedCards = [];
        const sourceDeck = studentConfig.deck;
        
        if (mode === 'practice') {
          selectedCards = [...sourceDeck];
        } else if (mode === 'testing') {
          // 依據老師的配額抽題
          CATEGORIES.forEach(cat => {
            const count = studentConfig.testCriteria[cat] || 0;
            if (count > 0) {
              const pool = sourceDeck.filter(c => c.category === cat);
              const shuffled = [...pool].sort(() => 0.5 - Math.random());
              selectedCards.push(...shuffled.slice(0, count));
            }
          });
        }
        
        selectedCards.sort(() => 0.5 - Math.random());
        setGameCards(selectedCards);
        setFlippedIds([]);
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        if (window.recognitionInstance) window.recognitionInstance.stop();
        
        if (mode === 'practice') setAppState('practice');
        if (mode === 'testing') {
          setTestAnswers({});
          setRecordingId(null);
          setAppState('testing');
        }
      };

      // 練習模式：唸讀
      const handlePracticeCardClick = (id) => {
        const isCurrentlyFlipped = flippedIds.includes(id);
        if (!isCurrentlyFlipped) {
          setFlippedIds(prev => [...prev, id]);
          const card = gameCards.find(c => c.id === id);
          if (card) {
            speakText(card.text, () => {
              setFlippedIds(prev => prev.filter(cardId => cardId !== id));
            });
          }
        } else {
          if (window.speechSynthesis) window.speechSynthesis.cancel();
          setFlippedIds(prev => prev.filter(cardId => cardId !== id));
        }
      };

      // 測驗模式：語音輸入
      const toggleRecording = (cardId) => {
        if (recordingId === cardId) {
          if (window.recognitionInstance) window.recognitionInstance.stop();
          setRecordingId(null);
          return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          return alert('您的瀏覽器不支援語音輸入！請使用 Google Chrome。');
        }

        if (window.recognitionInstance) window.recognitionInstance.stop();

        const recognition = new SpeechRecognition();
        recognition.lang = 'zh-TW';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onstart = () => setRecordingId(cardId);
        recognition.onresult = (event) => {
          const speechResult = event.results[0][0].transcript;
          setTestAnswers(prev => ({
            ...prev,
            [cardId]: (prev[cardId] || '') + speechResult
          }));
        };
        recognition.onerror = () => setRecordingId(null);
        recognition.onend = () => setRecordingId(null);

        window.recognitionInstance = recognition;
        recognition.start();
      };

      // 學生交卷並上傳雲端
      const submitTest = async () => {
        if (window.recognitionInstance) window.recognitionInstance.stop();
        setRecordingId(null);
        
        let correctCount = 0;
        gameCards.forEach(card => {
          const studentAns = normalizeText(testAnswers[card.id]);
          const correctAns = normalizeText(card.text);
          if (studentAns === correctAns) correctCount++;
        });
        
        const score = Math.round((correctCount / gameCards.length) * 100) || 0;
        setFinalScore({ score, correctCount });

        // 上傳到 Firestore 讓老師看到
        if (user) {
          try {
            const resultsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('testResults');
            await resultsRef.add({
              testId: urlTestId,
              studentName: studentName,
              score: score,
              correctCount: correctCount,
              totalCount: gameCards.length,
              details: JSON.stringify(testAnswers),
              timestamp: Date.now()
            });
          } catch (e) {
            console.error("Upload result failed:", e);
          }
        }

        setAppState('result');
      };


      // ================= 畫面渲染 =================

      // 1. 教師設定畫面
      if (appState === 'teacher_setup') {
        return (
          <div className="max-w-5xl mx-auto px-4 py-8">
            <header className="text-center mb-8">
              <h1 className="text-3xl sm:text-4xl font-bold text-indigo-800 mb-2 flex items-center justify-center gap-3">
                <i className="fa-solid fa-chalkboard-user text-indigo-500"></i>
                技能語音測驗系統 (教師端)
              </h1>
              <p className="text-slate-500 font-medium">設定完畢後，點擊派發即可產生學生專屬的 QR Code！</p>
            </header>

            <div className="bg-white rounded-2xl shadow-sm border border-indigo-100 p-6 sm:p-8 max-w-4xl mx-auto animate-[fadeIn_0.5s_ease-out]">
              <div className="flex items-center justify-between mb-6 border-b border-slate-100 pb-4">
                <h2 className="text-2xl font-bold text-slate-700 flex items-center gap-2">
                  <i className="fa-solid fa-gear text-slate-400"></i> 測驗前置作業
                </h2>
                <span className="bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full text-sm font-bold">
                  題庫共 {parsedDeck.length} 題
                </span>
              </div>

              <div className="border border-indigo-200 rounded-xl overflow-hidden bg-white shadow-sm mb-6">
                <button onClick={() => setShowSettings(!showSettings)} className="w-full bg-indigo-50 hover:bg-indigo-100 text-indigo-800 p-4 text-sm font-bold flex items-center justify-between transition-colors">
                  <span className="flex items-center gap-2"><i className="fa-solid fa-image"></i> Step 1. 上傳卡片專屬背面圖案</span>
                  <i className={`fa-solid fa-chevron-${showSettings ? 'up' : 'down'}`}></i>
                </button>
                {showSettings && (
                  <div className="p-4 grid grid-cols-3 sm:grid-cols-4 md:grid-cols-7 gap-2 bg-indigo-50/20">
                    {CATEGORIES.map(cat => (
                      <label key={cat} className="cursor-pointer border border-indigo-200 rounded-md p-2 flex flex-col items-center justify-center bg-white hover:bg-indigo-50 relative h-20 shadow-sm group transition-all">
                        {categoryImages[cat] ? <img src={categoryImages[cat]} alt={cat} className="h-full object-contain" /> : <span className="text-sm font-bold text-slate-400 group-hover:text-indigo-500">{cat}</span>}
                        <input type="file" accept="image/*" className="hidden" onChange={(e) => handleCategoryUpload(cat, e)} />
                        <div className="absolute inset-0 bg-black/60 text-white text-[10px] flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity rounded-md">更換</div>
                      </label>
                    ))}
                  </div>
                )}
              </div>

              <div className="flex flex-col md:flex-row gap-6 mb-8">
                <div className="bg-slate-50 p-5 rounded-xl border border-slate-200 flex-1">
                  <h3 className="font-bold text-slate-700 mb-2 flex items-center gap-2"><i className="fa-solid fa-keyboard text-indigo-500"></i> Step 2. 批次輸入技能</h3>
                  <p className="text-xs text-slate-500 mb-3">格式：<code>(類別)文字 空白鍵 文字</code></p>
                  <textarea value={skillsText} onChange={(e) => setSkillsText(e.target.value)} className="w-full p-3 rounded-lg border border-slate-300 bg-white outline-none focus:ring-2 focus:ring-indigo-400 font-mono text-[14px] resize-y custom-scrollbar" rows="8"></textarea>
                </div>

                <div className="bg-amber-50 p-5 rounded-xl border border-amber-200 w-full md:w-[280px] shrink-0">
                  <h3 className="font-bold text-amber-800 mb-2 flex items-center gap-2"><i className="fa-solid fa-clipboard-list"></i> Step 3. 測驗標準</h3>
                  <p className="text-xs text-amber-700/70 mb-4">設定本次測驗各類別抽考題數。</p>
                  <div className="space-y-2 max-h-[180px] overflow-y-auto pr-2 custom-scrollbar">
                    {CATEGORIES.map(cat => (
                      <div key={cat} className="flex items-center justify-between bg-white px-3 py-2 rounded-lg border border-amber-100">
                        <span className="font-bold text-sm text-slate-600">{cat} <span className="text-[10px] text-slate-400 font-normal">({availableCounts[cat]}題)</span></span>
                        <div className="flex items-center gap-2">
                          <button onClick={() => adjustCriteria(cat, -1)} className="w-6 h-6 rounded bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition-colors"><i className="fa-solid fa-minus text-xs"></i></button>
                          <span className="w-4 text-center font-bold text-indigo-700">{testCriteria[cat] || 0}</span>
                          <button onClick={() => adjustCriteria(cat, 1)} className="w-6 h-6 rounded bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition-colors"><i className="fa-solid fa-plus text-xs"></i></button>
                        </div>
                      </div>
                    ))}
                  </div>
                  <div className="mt-3 text-center border-t border-amber-200/50 pt-3">
                    <span className="text-sm font-bold text-amber-900">本次測驗共抽考：<span className="text-lg text-red-500">{totalTestCount}</span> 題</span>
                  </div>
                </div>
              </div>

              <button onClick={deployTest} className="w-full bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold text-xl py-4 rounded-xl shadow-lg transform hover:scale-[1.02] transition-all flex items-center justify-center gap-3">
                <i className="fa-solid fa-paper-plane"></i> 派發測驗 (產生 QR Code)
              </button>
            </div>
          </div>
        );
      }

      // 2. 教師派發後台儀表板
      if (appState === 'teacher_dashboard') {
        const qrUrl = `${window.location.origin}${window.location.pathname}?testId=${activeTestId}`;
        
        // 將學生成績依姓名分組
        const groupedResults = {};
        studentResults.forEach(r => {
          if (!groupedResults[r.studentName]) groupedResults[r.studentName] = [];
          groupedResults[r.studentName].push(r);
        });
        // 將每個學生的挑戰紀錄依時間排序
        Object.keys(groupedResults).forEach(name => {
          groupedResults[name].sort((a, b) => a.timestamp - b.timestamp);
        });

        return (
          <div className="max-w-6xl mx-auto px-4 py-8">
            <header className="flex justify-between items-center mb-8">
              <h1 className="text-3xl font-bold text-indigo-800 flex items-center gap-3">
                <i className="fa-solid fa-satellite-dish text-indigo-500"></i> 測驗即時監控台
              </h1>
              <button onClick={() => setAppState('teacher_setup')} className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-2 rounded-lg transition-colors">
                結束派發 (回設定)
              </button>
            </header>

            <div className="flex flex-col md:flex-row gap-6">
              {/* 左側：QR Code */}
              <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 flex flex-col items-center justify-center md:w-1/3 h-fit">
                <h2 className="text-xl font-bold text-slate-700 mb-4">請學生掃描進入</h2>
                <div className="bg-white p-4 border-4 border-indigo-100 rounded-xl mb-4">
                  <img src={`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(qrUrl)}`} alt="QR Code" className="w-48 h-48" />
                </div>
                <p className="text-xs text-slate-400 text-center break-all w-full overflow-hidden">{qrUrl}</p>
              </div>

              {/* 右側：學生成績追蹤 */}
              <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex-1">
                <h2 className="text-xl font-bold text-slate-700 mb-4 flex items-center gap-2">
                  <i className="fa-solid fa-chart-line text-green-500"></i> 學生測驗進度追蹤
                </h2>
                
                {Object.keys(groupedResults).length === 0 ? (
                  <div className="text-center py-20 text-slate-400 flex flex-col items-center">
                    <i className="fa-solid fa-hourglass-empty text-5xl mb-4 opacity-30"></i>
                    <p>等待學生繳卷中...</p>
                  </div>
                ) : (
                  <div className="space-y-4 max-h-[60vh] overflow-y-auto pr-2 custom-scrollbar">
                    {Object.keys(groupedResults).map(name => {
                      const attempts = groupedResults[name];
                      const latestAttempt = attempts[attempts.length - 1];
                      const bestAttempt = [...attempts].sort((a,b) => b.score - a.score)[0];

                      return (
                        <div key={name} className="bg-slate-50 border border-slate-200 rounded-xl p-4">
                          <div className="flex justify-between items-center mb-3 border-b border-slate-200 pb-2">
                            <span className="text-lg font-bold text-indigo-800 flex items-center gap-2">
                              <i className="fa-solid fa-user-graduate"></i> {name}
                            </span>
                            <span className="text-sm font-bold text-slate-500">共挑戰 {attempts.length} 次</span>
                          </div>
                          
                          <div className="grid gap-2">
                            {attempts.map((attempt, index) => {
                              const timeStr = new Date(attempt.timestamp).toLocaleTimeString('zh-TW', {hour: '2-digit', minute:'2-digit', second:'2-digit'});
                              return (
                                <div key={index} className={`flex items-center justify-between p-2 rounded-lg ${attempt.score === 100 ? 'bg-green-100 border border-green-200' : 'bg-white border border-slate-200'}`}>
                                  <div className="flex items-center gap-3">
                                    <span className="bg-slate-200 text-slate-600 text-xs font-bold px-2 py-1 rounded">第 {index + 1} 次</span>
                                    <span className="text-xs text-slate-400"><i className="fa-regular fa-clock"></i> {timeStr}</span>
                                  </div>
                                  <div className="flex items-center gap-3">
                                    <span className="text-sm text-slate-500">答對 {attempt.correctCount}/{attempt.totalCount}</span>
                                    <span className={`font-black text-lg ${attempt.score >= 80 ? 'text-green-600' : 'text-red-500'}`}>{attempt.score} 分</span>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      )
                    })}
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      // 3. 學生登入畫面
      if (appState === 'student_login') {
        return (
          <div className="flex items-center justify-center min-h-[80vh] px-4 animate-[fadeIn_0.5s_ease-out]">
            <div className="bg-white p-8 rounded-3xl shadow-xl border border-indigo-100 max-w-md w-full text-center">
              <i className="fa-solid fa-graduation-cap text-6xl text-indigo-500 mb-6"></i>
              <h1 className="text-3xl font-black text-slate-800 mb-2">技能語音測驗</h1>
              <p className="text-slate-500 font-medium mb-8">準備好接受挑戰了嗎？</p>
              
              <div className="text-left mb-6">
                <label className="block text-sm font-bold text-slate-700 mb-2">請輸入您的班級與姓名：</label>
                <input 
                  type="text" 
                  value={studentName}
                  onChange={(e) => setStudentName(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && studentLogin()}
                  placeholder="例如：101 王小明"
                  className="w-full p-4 rounded-xl border-2 border-slate-200 bg-slate-50 focus:bg-white focus:border-indigo-400 outline-none text-lg transition-all"
                />
              </div>

              <button 
                onClick={studentLogin}
                className="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold text-xl py-4 rounded-xl shadow-md transform hover:scale-[1.02] transition-all flex items-center justify-center gap-2"
              >
                進入測驗 <i className="fa-solid fa-arrow-right"></i>
              </button>
            </div>
          </div>
        );
      }

      // 4. 學生選擇模式選單
      if (appState === 'student_menu') {
        return (
           <div className="flex flex-col items-center justify-center min-h-[80vh] px-4 animate-[fadeIn_0.5s_ease-out]">
            <h2 className="text-3xl font-black text-indigo-800 mb-8">哈囉，{studentName}！</h2>
            <div className="flex flex-col sm:flex-row gap-6 w-full max-w-2xl">
              <div onClick={() => setupGameCards('practice')} className="flex-1 bg-white p-8 rounded-3xl shadow-md border-2 border-indigo-100 hover:border-indigo-400 cursor-pointer transform hover:-translate-y-2 transition-all text-center group">
                <div className="w-20 h-20 bg-indigo-100 text-indigo-500 rounded-full flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform"><i className="fa-solid fa-book-open-reader text-3xl"></i></div>
                <h3 className="text-2xl font-bold text-slate-700 mb-2">練習模式</h3>
                <p className="text-slate-500 text-sm">聽語音、看圖示，在腦中默念記下來！</p>
              </div>
              
              <div onClick={() => setupGameCards('testing')} className="flex-1 bg-white p-8 rounded-3xl shadow-md border-2 border-amber-100 hover:border-amber-400 cursor-pointer transform hover:-translate-y-2 transition-all text-center group">
                <div className="w-20 h-20 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform"><i className="fa-solid fa-microphone text-3xl"></i></div>
                <h3 className="text-2xl font-bold text-slate-700 mb-2">測驗模式</h3>
                <p className="text-slate-500 text-sm">考驗記憶力，用麥克風說出正確答案！</p>
              </div>
            </div>
          </div>
        );
      }

      // 5. 學生練習模式
      if (appState === 'practice') {
        return (
          <div className="max-w-5xl mx-auto px-4 py-8 animate-[fadeIn_0.5s_ease-out]">
            <div className="w-full flex items-center justify-between bg-white px-6 py-4 rounded-2xl shadow-sm border border-slate-200 mb-6">
              <button onClick={() => { if(window.speechSynthesis) window.speechSynthesis.cancel(); setAppState('student_menu'); }} className="text-slate-500 hover:text-indigo-600 font-bold flex items-center gap-2 bg-slate-100 px-4 py-2 rounded-lg">
                <i className="fa-solid fa-arrow-left"></i> 結束練習
              </button>
              <div className="text-indigo-800 font-bold hidden sm:flex items-center gap-2 bg-indigo-50 px-4 py-2 rounded-lg">
                <i className="fa-solid fa-headphones"></i> 點擊翻卡聽語音
              </div>
              <button onClick={() => setupGameCards('practice')} className="text-white font-bold flex items-center gap-2 bg-indigo-500 px-4 py-2 rounded-lg hover:bg-indigo-600 shadow-sm">
                <i className="fa-solid fa-shuffle"></i> 洗牌重練
              </button>
            </div>

            <div className="grid gap-4 w-full mx-auto" style={{ gridTemplateColumns: `repeat(auto-fit, minmax(140px, 1fr))` }}>
              {gameCards.map((card) => (
                <FlashCard 
                  key={card.id} 
                  card={card} 
                  mode="practice"
                  isFlipped={flippedIds.includes(card.id)}
                  onClick={() => handlePracticeCardClick(card.id)}
                  categoryImages={studentConfig.categoryImages}
                />
              ))}
            </div>
          </div>
        );
      }

      // 6. 學生測驗模式
      if (appState === 'testing') {
        return (
          <div className="max-w-5xl mx-auto px-4 py-8 animate-[fadeIn_0.5s_ease-out]">
            <div className="w-full flex items-center justify-between bg-white px-6 py-4 rounded-2xl shadow-sm border border-amber-200 mb-6">
              <button onClick={() => { if(window.recognitionInstance) window.recognitionInstance.stop(); setAppState('student_menu'); }} className="text-slate-500 hover:text-amber-600 font-bold flex items-center gap-2 bg-slate-100 px-4 py-2 rounded-lg">
                <i className="fa-solid fa-arrow-left"></i> 放棄測驗
              </button>
              <span className="font-black text-amber-600 text-lg sm:text-xl">
                測驗題數：{gameCards.length} 題
              </span>
              <button onClick={submitTest} className="text-white font-bold flex items-center gap-2 bg-green-500 px-6 py-2 rounded-lg hover:bg-green-600 shadow-md transform hover:scale-105 transition-all">
                <i className="fa-solid fa-check"></i> 交卷
              </button>
            </div>

            <div className="grid gap-6 w-full" style={{ gridTemplateColumns: `repeat(auto-fit, minmax(260px, 1fr))` }}>
              {gameCards.map((card, idx) => {
                const customImg = studentConfig.categoryImages[card.category];
                const style = getCategoryStyle(card.category);
                const isRecording = recordingId === card.id;

                return (
                  <div key={card.id} className="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col gap-3">
                    <div className="flex items-center gap-3 border-b border-slate-100 pb-3">
                      <span className="bg-slate-100 text-slate-500 font-bold px-2 py-1 rounded text-sm">#{idx + 1}</span>
                      <span className="font-bold text-indigo-800">{card.category}</span>
                    </div>
                    
                    <div className="w-full h-32 rounded-lg flex items-center justify-center bg-slate-50 border border-slate-100 relative overflow-hidden">
                      {customImg ? (
                        <img src={customImg} className="w-full h-full object-contain p-2" />
                      ) : (
                        <div className={`w-full h-full bg-gradient-to-br ${style.bg} flex items-center justify-center`}>
                          <i className={`fa-solid ${style.icon} text-4xl text-white opacity-80`}></i>
                        </div>
                      )}
                    </div>

                    <div className="relative mt-2">
                      <textarea
                        value={testAnswers[card.id] || ''}
                        onChange={(e) => setTestAnswers(prev => ({...prev, [card.id]: e.target.value}))}
                        placeholder="請點擊麥克風用語音回答..."
                        className={`w-full p-3 pr-12 rounded-lg border-2 ${isRecording ? 'border-red-400 bg-red-50' : 'border-slate-200 bg-white'} outline-none focus:border-indigo-400 text-base resize-none`}
                        rows="2"
                      ></textarea>
                      
                      <button 
                        onClick={() => toggleRecording(card.id)}
                        className={`absolute right-2 bottom-3 w-10 h-10 rounded-full flex items-center justify-center transition-all ${
                          isRecording 
                          ? 'bg-red-500 text-white recording-pulse shadow-lg transform scale-110' 
                          : 'bg-indigo-100 text-indigo-600 hover:bg-indigo-200 hover:scale-105'
                        }`}
                      >
                        <i className={`fa-solid ${isRecording ? 'fa-stop' : 'fa-microphone'}`}></i>
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>

            <div className="mt-8 mb-4 flex justify-center">
               <button onClick={submitTest} className="text-white font-bold flex items-center justify-center gap-3 bg-green-500 px-10 py-4 rounded-full text-xl hover:bg-green-600 shadow-lg transform hover:scale-105 transition-all w-full sm:w-auto">
                <i className="fa-solid fa-paper-plane"></i> 完成測驗，看成績！
              </button>
            </div>
          </div>
        );
      }

      // 7. 學生測驗結果
      if (appState === 'result') {
        const resultsHtml = gameCards.map(card => {
          const studentAns = normalizeText(testAnswers[card.id]);
          const correctAns = normalizeText(card.text);
          const isCorrect = studentAns === correctAns;

          return (
            <div key={card.id} className={`bg-white rounded-xl shadow-sm border-2 p-5 ${isCorrect ? 'border-green-300' : 'border-red-300'}`}>
              <div className="flex justify-between items-start mb-3 border-b border-slate-100 pb-3">
                <div className="font-bold text-slate-600">[{card.category}]</div>
                {isCorrect ? (
                  <div className="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm font-bold flex items-center gap-1"><i className="fa-solid fa-check-circle"></i> 答對</div>
                ) : (
                  <div className="bg-red-100 text-red-700 px-3 py-1 rounded-full text-sm font-bold flex items-center gap-1"><i className="fa-solid fa-xmark-circle"></i> 答錯</div>
                )}
              </div>
              <div className="space-y-3">
                <div>
                  <div className="text-xs text-slate-400 font-bold mb-1">你的回答：</div>
                  <div className={`p-3 rounded-lg text-lg ${isCorrect ? 'bg-green-50 text-green-800' : 'bg-red-50 text-red-800 line-through decoration-red-400'}`}>
                    {testAnswers[card.id] || '(未回答)'}
                  </div>
                </div>
                {!isCorrect && (
                  <div>
                    <div className="text-xs text-slate-400 font-bold mb-1">正確答案：</div>
                    <div className="p-3 rounded-lg bg-indigo-50 text-indigo-800 font-bold text-lg">
                      {card.text.replace(/\n/g, ' ')}
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        });

        return (
          <div className="max-w-5xl mx-auto px-4 py-8 flex flex-col items-center animate-[fadeIn_0.5s_ease-out]">
            <div className="bg-white px-10 py-8 rounded-3xl shadow-lg border border-slate-200 mb-8 text-center w-full max-w-2xl">
              <i className={`fa-solid ${finalScore.score >= 80 ? 'fa-trophy text-amber-400' : 'fa-medal text-slate-400'} text-6xl mb-4`}></i>
              <h2 className="text-3xl font-black text-slate-800 mb-2">測驗成績已送出</h2>
              <div className="text-6xl font-black text-indigo-600 mb-4">{finalScore.score} <span className="text-2xl text-slate-400">分</span></div>
              <p className="text-lg text-slate-600 font-medium">
                共 {gameCards.length} 題，你答對了 <span className="text-green-600 font-bold">{finalScore.correctCount}</span> 題！
              </p>
              
              <div className="mt-8 flex justify-center gap-4">
                <button onClick={() => setAppState('student_menu')} className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-6 py-3 rounded-xl transition-colors">
                  <i className="fa-solid fa-home"></i> 回選單
                </button>
                <button onClick={() => setupGameCards('testing')} className="bg-indigo-500 hover:bg-indigo-600 text-white font-bold px-6 py-3 rounded-xl shadow-md transition-colors">
                  <i className="fa-solid fa-rotate-right"></i> 再測一次
                </button>
              </div>
            </div>

            <div className="w-full">
              <h3 className="text-xl font-bold text-slate-700 mb-4 flex items-center gap-2">
                <i className="fa-solid fa-list-check"></i> 逐題檢討
              </h3>
              <div className="grid gap-4" style={{ gridTemplateColumns: `repeat(auto-fit, minmax(300px, 1fr))` }}>
                {resultsHtml}
              </div>
            </div>
          </div>
        );
      }

      return null;
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
